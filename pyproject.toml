[project]
name = "pipeline-cinema"
version = "0.1.0"
description = "Pipeline de dados analítico sobre o dataset MovieLens com Python, DuckDB e SQL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["test/*", ".venv/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true

